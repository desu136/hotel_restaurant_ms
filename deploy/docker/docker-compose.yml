name: rms

services:
  db:
    image: postgres:16-alpine
    container_name: rms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rms}
    volumes:
      - rms_pgdata:/var/lib/postgresql/data
    networks: [rms_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rms} -d ${POSTGRES_DB:-rms}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M

  backend:
    container_name: rms-backend
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-rms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rms}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-https://134.122.73.65/rms}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    networks: [rms_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    container_name: rms-frontend
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/rms}
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/rms}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - backend
    networks:
      rms_net:
      hulesport:
        aliases: [rms-frontend]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M

  proxy:
    image: nginx:1.27-alpine
    container_name: rms-proxy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "3010:80"
      - "8443:443"
    volumes:
      - ./nginx-rms.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [rms_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  rms_pgdata:

networks:
  rms_net:
    name: rms_net
  hulesport:
    name: hulesport_hulesport
    external: true
